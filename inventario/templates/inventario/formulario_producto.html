<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ accion }} Producto</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        form { max-width: 500px; }
        label, input { display: block; width: 100%; margin-bottom: 10px; }
        input { padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        a { display: block; margin-top: 1em; }
    </style>
</head>
<body>
    <h1>{{ accion }} Producto</h1>
    <form method="post">
        {% csrf_token %}
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" required>

        <label for="categoria">Categoría:</label>
        <input type="text" id="categoria" name="categoria" value="{{ producto.categoria }}">

        <label for="descripcion">Descripción:</label>
        <input type="text" id="descripcion" name="descripcion" value="{{ producto.descripcion }}">

        <label for="precio">Precio:</label>
        <input type="number" step="0.01" id="precio" name="precio" value="{{ producto.precio }}" required>

        <label for="cantidad">Cantidad en Stock:</label>
        <input type="number" id="cantidad" name="cantidad" value="{{ producto.cantidad }}" required>

        <label for="fecha_vencimiento">Fecha de Vencimiento (si aplica):</label>
        <input type="date" id="fecha_vencimiento" name="fecha_vencimiento" value="{{ producto.fecha_vencimiento }}">

        <button type="submit">Guardar Cambios</button>
    </form>
    <a href="{% url 'listar_productos' %}">Volver a la lista</a>
</body>
</html>
